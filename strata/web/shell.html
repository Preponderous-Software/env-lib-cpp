<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>env-lib-cpp on Strata</title>
<meta name="description" content="env-lib-cpp's demo worlds in 3D on the Strata engine: ten walkers on an 8x8 grid, and a 20x20 meadow where sheep graze and wolves stalk them.">
<style>
  :root {
    --bg: #090b12; --panel: rgba(16, 19, 30, 0.94); --line: #2a3046; --text: #e6eaf2; --dim: #9aa3b8;
    --accent: #ffc23a; --btn: #1a1f30; --btn-on: #3a3118;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .bar { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 6px max(10px, env(safe-area-inset-left)); background: var(--panel); }
  #top { border-bottom: 1px solid var(--line); padding-top: max(6px, env(safe-area-inset-top)); }
  #tools { border-top: 1px solid var(--line); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  .brand { font-weight: 700; letter-spacing: 0.02em; margin-right: 4px; }
  .brand a { color: var(--text); text-decoration: none; }
  .brand small { color: var(--dim); font-weight: 400; }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  canvas#canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; background: #000; }
  #hint { position: absolute; right: 8px; bottom: 8px; max-width: calc(100% - 16px); padding: 4px 8px;
    border-radius: 6px; background: rgba(9, 11, 18, 0.7); color: var(--dim); font-size: 12px; pointer-events: none; }
  button { font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 11px; min-height: 40px; min-width: 40px; cursor: pointer; touch-action: manipulation; }
  button[aria-pressed="true"] { background: var(--btn-on); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); }
  .group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  #status { color: var(--dim); font: 12px ui-monospace, monospace; margin-left: auto; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
  #picked { flex: 0 0 auto; display: none; padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line);
    font: 12px/1.4 ui-monospace, monospace; max-height: 22vh; overflow-y: auto; }
  #picked.on { display: block; }
  #picked b { color: var(--accent); }
  #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; max-width: min(92vw, 460px); text-align: center; }
  a { color: var(--accent); }
  @media (max-width: 640px) {
    #status { max-width: 100%; margin-left: 0; flex-basis: 100%; }
    button { padding: 6px 9px; }
    .brand small { display: none; }
  }
</style>
</head>
<body>
<div id="top" class="bar">
  <span class="brand"><a href="https://github.com/Preponderous-Software/env-lib-cpp" title="Source and documentation">env-lib-cpp</a> <small>on Strata</small></span>
  <div class="group" role="group" aria-label="World">
    <button data-world="0" title="Ten walkers on an 8x8 grid, each stepping to a random neighbouring square every tick">Walkers</button>
    <button data-world="1" title="A 20x20 meadow: sheep graze, wolves stalk the nearest sheep, flowers stay put, and the grass grows back">Meadow</button>
  </div>
  <span id="status" aria-live="polite"></span>
</div>

<div id="stage">
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="hint">Drag to pan &middot; wheel or +/&minus; to zoom &middot; click or tap a square to see who is there</div>
</div>

<div id="picked" aria-live="polite"></div>

<div id="tools" class="bar" role="group" aria-label="Controls">
  <button id="pause" data-key="44" aria-pressed="false" title="Pause or run the simulation (Space)">Pause</button>
  <button id="step" data-key="17" title="One tick while paused (N)">Step</button>
  <button data-key="54" title="Slower (,)" aria-label="Slower">&laquo;</button>
  <button data-key="55" title="Faster (.)" aria-label="Faster">&raquo;</button>
  <span class="sep"></span>
  <button id="rotL" title="Turn the view left (Q)" aria-label="Turn left">&#x27F2;</button>
  <button id="rotR" title="Turn the view right (E)" aria-label="Turn right">&#x27F3;</button>
  <button id="zoomIn" title="Zoom in (wheel, +)" aria-label="Zoom in">+</button>
  <button id="zoomOut" title="Zoom out (wheel, -)" aria-label="Zoom out">&minus;</button>
  <button id="home" title="Frame the whole grid again">Home</button>
  <button id="hud" data-key="43" aria-pressed="true" title="Show or hide the text on the view (Tab)">HUD</button>
</div>

<div id="loading">Loading env-lib-cpp on Strata&hellip;</div>

<!-- ?bench: a scripted frame-rate run (web/bench.js); it must load before the engine. -->
<script src="bench.js"></script>
<script>
  'use strict';
  const canvas = document.getElementById('canvas');
  const loading = document.getElementById('loading');
  const statusEl = document.getElementById('status');
  const picked = document.getElementById('picked');
  const hint = document.getElementById('hint');
  let api = null;

  let lastW = 0, lastH = 0, lastDpr = 0;
  function fit() {
    // The engine sizes the canvas through SDL, which multiplies by the device
    // pixel ratio; at most 2 drawn pixels per CSS pixel keeps phones quick.
    const st = document.getElementById('stage');
    const w = Math.max(1, st.clientWidth), h = Math.max(1, st.clientHeight);
    const dpr = window.devicePixelRatio || 1;
    if (api && (w !== lastW || h !== lastH || dpr !== lastDpr)) {
      lastW = w; lastH = h; lastDpr = dpr;
      const k = dpr > 2 ? 2 / dpr : 1;
      api.resize(Math.round(w * k), Math.round(h * k), w, h);
    }
  }
  function choose(i, remember = true) {
    if (!api || !api.open(i)) return;
    document.querySelectorAll('[data-world]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.world) === i)));
    if (remember) try { localStorage.setItem('envlib.world', String(i)); } catch (e) {}
    lastPicked = '';
    refresh();
    canvas.focus();
  }
  let lastPicked = '';
  function refresh() {
    if (!api) return;
    const s = JSON.parse(api.status());
    statusEl.textContent = `${s.environment} ${s.grid}x${s.grid} · tick ${s.tick} · ${s.entities} entities · ` +
      (s.paused ? 'paused' : `running ${s.speed}x`);
    const pause = document.getElementById('pause');
    pause.textContent = s.paused ? 'Run' : 'Pause';
    pause.setAttribute('aria-pressed', String(s.paused));
    document.getElementById('step').disabled = !s.paused;
    document.getElementById('hud').setAttribute('aria-pressed', String(s.hud));
    const key = s.pickX < 0 ? '' : JSON.stringify([s.pickX, s.pickY, s.here]);
    if (key !== lastPicked) {
      lastPicked = key;
      picked.classList.toggle('on', s.pickX >= 0);
      if (s.pickX >= 0) {
        const head = document.createElement('b');
        head.textContent = `(${s.pickX}, ${s.pickY}): ${s.here.length} here`;
        const list = document.createElement('span');
        list.textContent = s.here.length ? '  ' + s.here.map(e => `#${e.id} ${e.name}`).join(', ') : '';
        picked.replaceChildren(head, list);
        hint.style.display = 'none';
        fit();
      } else {
        picked.replaceChildren();
        fit();
      }
    }
  }

  var Module = {
    canvas: canvas,
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
    onRendererFailed: (why) => {
      loading.textContent = 'This browser could not start WebGL 2 (' + why + ').';
    },
    onViewerReady: () => {
      api = {
        open: Module.cwrap('envlib_open', 'number', ['number']),
        resize: Module.cwrap('envlib_resize', null, ['number', 'number', 'number', 'number']),
        key: Module.cwrap('envlib_key', null, ['number']),
        zoom: Module.cwrap('envlib_zoom', null, ['number']),
        rotate: Module.cwrap('envlib_rotate', null, ['number']),
        home: Module.cwrap('envlib_home', null, []),
        pick: Module.cwrap('envlib_pick', 'number', ['number', 'number']),
        status: Module.cwrap('envlib_status', 'string', []),
      };
      window.envlib = api;
      loading.style.display = 'none';
      fit();
      let start = 0;
      try { start = Number(localStorage.getItem('envlib.world')) || 0; } catch (e) {}
      const q = new URLSearchParams(location.search).get('world');
      if (q === 'walkers') start = 0;
      if (q === 'meadow') start = 1;
      if (window.StrataBench && StrataBench.requested) {
        // Always the walkers from their first tick, one turn around the grid,
        // closing in and back out, so runs on different devices are comparable.
        // The camera calls are relative: each frame moves it by the path's step.
        let at = 0;
        const dist = (u) => 1 - 0.35 * Math.sin(Math.PI * u);
        StrataBench.run({
          name: 'env-lib-cpp', scene: 'walkers (seed 7), one orbit', canvas,
          setup: () => { choose(0, false); fit(); api.home(); },
          path: (u) => { api.rotate(360 * (u - at)); api.zoom(dist(u) / dist(at)); at = u; },
        });
      } else {
        choose(Math.min(1, Math.max(0, start)));
      }
      fit();
      setInterval(refresh, 250);
    },
  };
  document.querySelectorAll('[data-world]').forEach(b => b.addEventListener('click', () => choose(Number(b.dataset.world))));
  document.querySelectorAll('[data-key]').forEach(b => b.addEventListener('click', () => {
    if (api) { api.key(Number(b.dataset.key)); refresh(); }
    canvas.focus();
  }));
  const on = (id, fn) => document.getElementById(id).addEventListener('click', () => { if (api) fn(); canvas.focus(); });
  on('rotL', () => api.rotate(-15));
  on('rotR', () => api.rotate(15));
  on('zoomIn', () => api.zoom(0.8));
  on('zoomOut', () => api.zoom(1.25));
  on('home', () => api.home());

  // Two fingers pinch to zoom (one finger pans, through SDL, as a mouse drag).
  let pinch = 0;
  const spread = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  canvas.addEventListener('touchstart', (e) => { if (e.touches.length === 2) pinch = spread(e.touches); }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (!api || e.touches.length !== 2 || pinch <= 0) return;
    const d = spread(e.touches);
    if (d > 0) { api.zoom(pinch / d); pinch = d; }
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinch = 0; }, { passive: true });

  window.addEventListener('resize', fit);
  new ResizeObserver(fit).observe(document.getElementById('stage'));
</script>
{{{ SCRIPT }}}
</body>
</html>
