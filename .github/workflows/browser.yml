# Builds the Strata frontend's demo worlds for the browser (Emscripten +
# Strata's WebGL 2 backend), runs the view tests as wasm under Node, and
# smoke-tests the page in headless Chromium on a desktop and a phone profile,
# and, when enabled, deploys it to arcade as
# https://env-lib-cpp.play.danielstephenson.dev
name: Browser build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Web build and smoke test (headless Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned Strata
        run: |
          ref="$(tr -d '[:space:]' < strata/strata.ref)"
          test -n "$ref"
          git init -q "$RUNNER_TEMP/strata"
          git -C "$RUNNER_TEMP/strata" fetch -q --depth 1 https://github.com/Preponderous-Software/strata.git "$ref"
          git -C "$RUNNER_TEMP/strata" checkout -q FETCH_HEAD
          echo "STRATA_DIR=$RUNNER_TEMP/strata" >> "$GITHUB_ENV"

      - name: Set up emsdk 6.0.11 (Strata's pin)
        run: |
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.11
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.11

      - name: Configure and build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S strata -B build-web -DCMAKE_BUILD_TYPE=Release -DENVLIB_STRATA_WARNINGS_AS_ERRORS=ON \
            -DFETCHCONTENT_SOURCE_DIR_STRATA="$STRATA_DIR" -Wno-dev
          cmake --build build-web -j "$(nproc)"

      - name: View tests as wasm (Node)
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ctest --test-dir build-web --output-on-failure

      - name: Assemble the site
        run: |
          mkdir -p web-site
          cp build-web/envlib-strata.html web-site/index.html
          cp build-web/envlib-strata.js build-web/envlib-strata.wasm build-web/bench.js web-site/
          ls -l web-site
          echo "site: $(du -sh web-site | cut -f1)"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        working-directory: strata/web/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke test (desktop, then iPhone 13 profile)
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory web-site > http.log 2>&1 &
          sleep 1
          node strata/web/smoke/smoke.cjs http://127.0.0.1:8080/ smoke-out/desktop
          node strata/web/smoke/smoke.cjs http://127.0.0.1:8080/ smoke-out/phone --phone

      - name: Bench mode completes and shows its card (desktop, iPhone 13 profile)
        run: |
          node strata/web/smoke/bench.cjs "http://127.0.0.1:8080/?bench=3" smoke-out/bench-desktop
          node strata/web/smoke/bench.cjs "http://127.0.0.1:8080/?bench=3" smoke-out/bench-phone --phone

      - name: Upload the site and the smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            web-site/
            smoke-out/
          if-no-files-found: ignore

      - name: Write the deploy version
        run: |
          version=$(sed -n 's/^project(envlib_strata VERSION \([0-9.]*\).*/\1/p' strata/CMakeLists.txt)
          test -n "$version"
          echo "${version}+g${GITHUB_SHA::7}" > "$RUNNER_TEMP/arcade-version.txt"
          cat "$RUNNER_TEMP/arcade-version.txt"

      - name: Deploy to arcade
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.ARCADE_ENABLED == 'true')
        uses: Stephenson-Software/arcade-deploy@v1
        with:
          slug: env-lib-cpp
          token: ${{ secrets.ARCADE_TOKEN }}
          site-dir: web-site
          version-file: ${{ runner.temp }}/arcade-version.txt
